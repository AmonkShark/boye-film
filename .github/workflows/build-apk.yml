name: Build APK Boye Film
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk BoyeFilm.apk
      - uses: actions/upload-artifact@v4
        with: { name: BoyeFilm-apk, path: BoyeFilm.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Boye Film v2.0.${{ github.run_number }}
          files: BoyeFilm.apk
          make_latest: true
