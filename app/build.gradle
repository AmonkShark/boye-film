plugins { id 'com.android.application' }
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'com.boyefilm.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.boyefilm.app'
        minSdk 24
        targetSdk 34
        versionCode 100 + runNo
        versionName "2.1.${runNo}"
    }
    signingConfigs {
        boye {
            storeFile file('boyefilm.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'boyefilm'
            keyPassword System.getenv('KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.boye } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
