<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<title>Boye Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: feed layar penuh dengan snap vertikal; kontrol kaca mengambang di kanan; info film di kiri bawah */
:root{
  --ink:#06070a; --fg:#f6f3ee; --muted:rgba(246,243,238,.62);
  --hot:#ff4d2e; --heat:#ffb21a; --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.16);
  --grad:linear-gradient(135deg,var(--heat),var(--hot) 55%,#ff1f6b);
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--heat);outline-offset:3px}

/* Splash */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ink);transition:opacity .6s,visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
.logo{font-family:var(--display);font-size:clamp(48px,14vw,84px);letter-spacing:.02em;line-height:.9;text-align:center}
.logo b{display:block;font-weight:400;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font:500 12px var(--body);letter-spacing:.32em;color:var(--muted);margin-top:14px;text-transform:uppercase}
.bar{width:120px;height:3px;border-radius:3px;background:var(--line);margin:22px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--grad);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* Top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(10px + env(safe-area-inset-top,0px)) 0 18px;background:linear-gradient(rgba(6,7,10,.85),transparent);transition:opacity .4s}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand h1{margin:0;font:400 24px var(--display);letter-spacing:.03em}
.brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 10px var(--hot);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s}
.chip.on{background:var(--fg);color:var(--ink);border-color:transparent}

/* Feed */
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.backdrop{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4) brightness(.45)}
.slide video{position:relative;width:100%;height:100%;object-fit:contain}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,rgba(6,7,10,.92)),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}

.info{position:absolute;left:0;right:84px;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(34px + env(safe-area-inset-bottom,0px));transition:opacity .4s,transform .4s}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.badge.hot{background:var(--grad);border-color:transparent;color:#160600}
.info h2{font:400 clamp(36px,9.5vw,62px)/.92 var(--display);margin:12px 0 8px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.meta i{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.desc{font-size:14px;line-height:1.55;margin:10px 0 0;max-width:58ch;color:rgba(246,243,238,.85);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{-webkit-line-clamp:8}

.rail{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;align-items:center;transition:opacity .4s}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted)}
.act span.ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s,background .2s}
.act:active span.ic{transform:scale(.88)}
.act svg{width:23px;height:23px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on span.ic{background:var(--grad);border-color:transparent}
.act.on svg{fill:var(--fg)}

/* Progress */
.prog{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:18px;display:flex;align-items:flex-end;cursor:pointer;touch-action:none}
.prog .track{position:relative;width:100%;height:3px;background:rgba(255,255,255,.18);transition:height .2s}
.prog:hover .track,.prog.drag .track{height:6px}
.prog .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--grad);box-shadow:0 0 12px var(--hot)}
.time{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;transition:opacity .4s}

.center{position:absolute;inset:0;margin:auto;width:86px;height:86px;border-radius:50%;border:0;background:rgba(6,7,10,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--line),0 0 40px rgba(255,77,46,.35)}
.center svg{width:34px;height:34px;fill:var(--fg);margin-left:5px}
.spin{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hot);animation:rot .8s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.burst{position:absolute;width:110px;height:110px;pointer-events:none;animation:pop .8s ease-out forwards}
.burst svg{width:100%;height:100%;fill:url(#hg);filter:drop-shadow(0 0 18px rgba(255,77,46,.7))}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(0);opacity:1}100%{transform:translate(-50%,-120%) scale(.9);opacity:0}}
.toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Skeleton */
.skel{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px}
.skel i{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,#14161c,#22252e,#14161c);background-size:200%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Mode imersif: UI hilang saat film berjalan */
.slide.calm .info,.slide.calm .rail,.slide.calm .time{opacity:0;pointer-events:none}
body.calm .top{opacity:0;pointer-events:none}

/* Horizontal */
@media (orientation:landscape){
  .info{right:110px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .info h2{font-size:clamp(28px,7vh,44px);margin:8px 0 4px}
  .desc{-webkit-line-clamp:1}
  .rail{bottom:auto;top:50%;transform:translateY(-40%);gap:10px}
  .act span.ic{width:44px;height:44px}
  .act small{display:none}
  .top{padding-bottom:10px}
  .chips{padding-top:8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb21a"/><stop offset=".55" stop-color="#ff4d2e"/><stop offset="1" stop-color="#ff1f6b"/></linearGradient></defs></svg>

<div id="splash"><div class="logo">BOYE<b>FILM</b><small>Film aksi tanpa cari judul</small><div class="bar"><i></i></div></div></div>

<div class="top" id="top">
  <div class="brand"><h1>BOYE<span>FILM</span></h1><div class="live">PUTAR TERUS</div></div>
  <nav class="chips" id="chips"></nav>
</div>

<main id="feed"><div class="skel" id="skel"><i style="width:30%"></i><i style="width:75%;height:40px"></i><i style="width:55%"></i><i style="width:85%"></i></div></main>
<div class="toast" id="toast"></div>

<script>
const IC={
  heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',
  rot:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M8 3h8M12 18v3"/></svg>',
  full:'<svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>',
  skip:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>'
};
const GENRES=[
  ['Untukmu','(subject:(action) OR subject:(adventure) OR subject:(western) OR subject:(martial arts) OR subject:(war) OR subject:(crime))'],
  ['Koboi','subject:(western)'],['Perang','subject:(war)'],['Kungfu','(subject:(martial arts) OR subject:(kung fu))'],
  ['Petualangan','subject:(adventure)'],['Kriminal','(subject:(crime) OR subject:(noir))'],['Laga','subject:(action)']
];
const $=s=>document.querySelector(s);
const feed=$('#feed');
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const seen=new Set(store.get('bf_seen',[])),liked=new Set(store.get('bf_liked',[]));
let genre=0,queue=[],page=1,loading=false,muted=false,current=null,token=0;

/* Chips */
GENRES.forEach(([n],i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=n;b.onclick=()=>setGenre(i,b);$('#chips').appendChild(b)});
function setGenre(i,b){
  if(i===genre)return;genre=i;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  token++;queue=[];page=1+Math.floor(Math.random()*3);loading=false;
  feed.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});
  feed.innerHTML=$('#skel')?.outerHTML||'<div class="skel" id="skel"><i style="width:40%"></i><i style="width:80%;height:40px"></i></div>';
  more();
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1400)}

/* Data */
async function fetchBatch(){
  const q='collection:(feature_films) AND mediatype:(movies) AND '+GENRES[genre][1];
  const url='https://archive.org/advancedsearch.php?q='+encodeURIComponent(q)+'&fl[]=identifier&fl[]=title&fl[]=year&fl[]=description&fl[]=subject&rows=24&page='+(page++)+'&output=json&sort[]=downloads+desc';
  const j=await (await fetch(url)).json();
  return j.response.docs.filter(d=>!seen.has(d.identifier)).sort(()=>Math.random()-.5);
}
async function videoFor(id){
  const j=await (await fetch('https://archive.org/metadata/'+id)).json();
  const files=(j.files||[]).filter(f=>/\.mp4$/i.test(f.name));
  if(!files.length)return null;
  const f=files.find(f=>/512kb|h\.264/i.test(f.name+f.format))||files.sort((a,b)=>(+b.size||0)-(+a.size||0))[0];
  const len=parseFloat(f.length||0);
  if(len&&len<45*60)return null;
  return{src:'https://archive.org/download/'+id+'/'+encodeURIComponent(f.name),len};
}
const clean=t=>{const d=document.createElement('div');d.innerHTML=Array.isArray(t)?t[0]:(t||'');return d.textContent.replace(/\s+/g,' ').trim()};
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const dur=s=>{const h=Math.floor(s/3600),m=Math.round(s%3600/60);return(h?h+'j ':'')+m+'m'};

/* Slide */
function makeSlide(doc,v){
  const s=document.createElement('section');s.className='slide';s.dataset.id=doc.identifier;
  const img='https://archive.org/services/img/'+doc.identifier;
  const sub=[].concat(doc.subject||[]).map(String).find(x=>/western|war|martial|kung|adventure|crime|noir|action/i.test(x));
  const lbl=sub?({western:'Koboi',war:'Perang',martial:'Kungfu',kung:'Kungfu',adventure:'Petualangan',crime:'Kriminal',noir:'Kriminal',action:'Laga'})[Object.keys({western:1,war:1,martial:1,kung:1,adventure:1,crime:1,noir:1,action:1}).find(k=>new RegExp(k,'i').test(sub))]:'Laga';
  const isLiked=liked.has(doc.identifier);
  s.innerHTML=`<div class="backdrop" style="background-image:url('${img}')"></div>
  <video playsinline preload="none" poster="${img}"></video><div class="vignette"></div>
  <div class="spin" hidden></div><button class="center" hidden aria-label="Putar">${IC.play}</button>
  <div class="info"><div class="badges"><span class="badge hot">${lbl}</span><span class="badge">Full Movie</span></div>
    <h2></h2><div class="meta"><span>${doc.year||'Klasik'}</span>${v.len?'<i></i><span>'+dur(v.len)+'</span>':''}<i></i><span>Gratis</span></div>
    <p class="desc"></p></div>
  <div class="rail">
    <button class="act like${isLiked?' on':''}" aria-label="Suka"><span class="ic">${IC.heart}</span><small>Suka</small></button>
    <button class="act snd" aria-label="Suara"><span class="ic">${muted?IC.mute:IC.vol}</span><small>Suara</small></button>
    <button class="act rot" aria-label="Putar layar"><span class="ic">${IC.rot}</span><small>Putar</small></button>
    <button class="act fs" aria-label="Layar penuh"><span class="ic">${IC.full}</span><small>Penuh</small></button>
    <button class="act nxt" aria-label="Film berikutnya"><span class="ic">${IC.skip}</span><small>Lewati</small></button>
  </div>
  <div class="time">0:00 / ${v.len?fmt(v.len):'--'}</div>
  <div class="prog"><div class="track"><div class="fill"></div></div></div>`;
  s.querySelector('h2').textContent=clean(doc.title);
  const desc=s.querySelector('.desc');desc.textContent=clean(doc.description).slice(0,600)||'Film aksi klasik lengkap dari arsip domain publik.';
  desc.onclick=e=>{e.stopPropagation();desc.classList.toggle('open')};

  const vid=s.querySelector('video'),center=s.querySelector('.center'),spin=s.querySelector('.spin'),fill=s.querySelector('.fill'),time=s.querySelector('.time');
  vid.dataset.src=v.src;vid.muted=muted;
  vid.addEventListener('waiting',()=>spin.hidden=false);
  vid.addEventListener('playing',()=>{spin.hidden=true;center.hidden=true;calm(s)});
  vid.addEventListener('pause',()=>{center.hidden=false;wake(s,false)});
  vid.addEventListener('timeupdate',()=>{const d=vid.duration||v.len;fill.style.width=(vid.currentTime/d*100)+'%';time.textContent=fmt(vid.currentTime)+' / '+fmt(d)});
  vid.addEventListener('ended',()=>next(s));
  center.onclick=e=>{e.stopPropagation();vid.play()};

  // Ketuk: tampilkan UI / jeda. Ketuk dua kali: suka.
  let last=0,tm;
  s.addEventListener('click',e=>{
    if(e.target.closest('button,.prog,.desc'))return;
    const now=Date.now();
    if(now-last<300){clearTimeout(tm);like(s,true,e)}
    else tm=setTimeout(()=>{if(s.classList.contains('calm'))wake(s);else vid.paused?vid.play():vid.pause()},300);
    last=now;
  });
  s.querySelector('.like').onclick=e=>{e.stopPropagation();like(s)};
  s.querySelector('.snd').onclick=e=>{e.stopPropagation();muted=!muted;document.querySelectorAll('video').forEach(x=>x.muted=muted);document.querySelectorAll('.snd .ic').forEach(i=>i.innerHTML=muted?IC.mute:IC.vol);toast(muted?'Suara mati':'Suara nyala')};
  s.querySelector('.rot').onclick=e=>{e.stopPropagation();toggleOrientation()};
  s.querySelector('.fs').onclick=e=>{e.stopPropagation();(vid.requestFullscreen||vid.webkitEnterFullscreen||(()=>{})).call(vid)};
  s.querySelector('.nxt').onclick=e=>{e.stopPropagation();next(s)};

  // Geser progress
  const prog=s.querySelector('.prog');
  const seek=e=>{const r=prog.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));const d=vid.duration||v.len;if(d){vid.currentTime=p*d;fill.style.width=p*100+'%'}};
  prog.addEventListener('pointerdown',e=>{e.stopPropagation();prog.classList.add('drag');prog.setPointerCapture(e.pointerId);seek(e);wake(s)});
  prog.addEventListener('pointermove',e=>{if(prog.classList.contains('drag'))seek(e)});
  prog.addEventListener('pointerup',()=>prog.classList.remove('drag'));
  observer.observe(s);return s;
}
function like(s,force,e){
  const id=s.dataset.id,btn=s.querySelector('.like');
  const on=force?true:!liked.has(id);
  on?liked.add(id):liked.delete(id);btn.classList.toggle('on',on);store.set('bf_liked',[...liked]);
  if(on){const b=document.createElement('div');b.className='burst';b.innerHTML=IC.heart;
    const r=s.getBoundingClientRect();b.style.left=(e?e.clientX-r.left:r.width/2)+'px';b.style.top=(e?e.clientY-r.top:r.height/2)+'px';
    s.appendChild(b);setTimeout(()=>b.remove(),800)}
}
function next(s){const n=s.nextElementSibling;if(n)n.scrollIntoView({behavior:'smooth'})}
function calm(s){clearTimeout(s._c);s._c=setTimeout(()=>{const v=s.querySelector('video');if(!v.paused){s.classList.add('calm');if(s===current)document.body.classList.add('calm')}},3500)}
function wake(s,auto=true){s.classList.remove('calm');document.body.classList.remove('calm');if(auto)calm(s)}

async function toggleOrientation(){
  const land=matchMedia('(orientation:landscape)').matches;
  try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();await screen.orientation.lock(land?'portrait':'landscape')}
  catch(_){toast('Miringkan HP untuk mode horizontal')}
}
addEventListener('resize',()=>{if(current)current.scrollIntoView({block:'start'})});

const observer=new IntersectionObserver(es=>es.forEach(e=>{
  const s=e.target,vid=s.querySelector('video');
  if(e.isIntersecting&&e.intersectionRatio>.6){
    current=s;document.body.classList.toggle('calm',s.classList.contains('calm'));
    if(!vid.src){vid.src=vid.dataset.src;s.querySelector('.spin').hidden=false}
    vid.play().catch(()=>{s.querySelector('.spin').hidden=true;s.querySelector('.center').hidden=false});
    seen.add(s.dataset.id);store.set('bf_seen',[...seen].slice(-400));
    if(!s.nextElementSibling||!s.nextElementSibling.nextElementSibling)more();
  }else if(!vid.paused)vid.pause();
}),{threshold:[0,.6]});

async function more(){
  if(loading)return;loading=true;const my=token;
  try{
    let added=0,tries=0;
    while(added<3&&tries<40){
      tries++;
      if(!queue.length)queue=await fetchBatch();
      if(my!==token)return;
      if(!queue.length)break;
      const doc=queue.shift();
      const v=await videoFor(doc.identifier).catch(()=>null);
      if(my!==token)return;
      if(!v)continue;
      $('#skel')?.remove();feed.appendChild(makeSlide(doc,v));added++;
      $('#splash').classList.add('gone');
    }
    if(!feed.querySelector('.slide')){$('#splash').classList.add('gone');feed.innerHTML='<div class="skel" style="justify-content:center;align-items:center;color:var(--muted)">Belum ada film untuk genre ini. Coba genre lain.</div>'}
  }catch(e){
    $('#splash').classList.add('gone');
    if(!feed.querySelector('.slide'))feed.innerHTML='<div class="skel" style="justify-content:center;align-items:center;color:var(--muted);text-align:center">Tidak bisa memuat film. Periksa koneksi internet lalu buka ulang aplikasi.</div>';
  }finally{if(my===token)loading=false}
}
more();
</script>
</body>
</html>
